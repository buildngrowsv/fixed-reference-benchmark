<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio research queue</title>
<style>
*{box-sizing:border-box}body{background:#f7f5f0;color:#233329;margin:0;font:16px/1.5 "Inter",system-ui,sans-serif}main{max-width:1000px;margin:40px auto;padding:0 24px 52px}h1{margin:0;font:52px/1.04 Georgia,serif;letter-spacing:-2px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px}.current{background:#143d35;color:#f1f5e9;border-radius:10px;padding:22px 26px}.current h2{color:#b3d8c7;margin:0;font:600 14px system-ui}.current strong{display:block;font-size:25px;margin:6px 0}progress{display:block;width:100%;height:8px;accent-color:#c2ddb4;margin:12px 0}.section{margin-top:26px}h2{font: bold 22px Georgia,serif}.row{display:grid;grid-template-columns: minmax(180px,1fr) minmax(110px,.4fr) auto;align-items:center;gap:14px;border-bottom:1px solid #d7ddd2;padding:12px 0}.row strong{font-weight:620}.row span,small{font-size:14px;color:#516158}.row button,header button{cursor:pointer;border:1px solid #9dac9d;background:#fff;border-radius:7px;padding:7px 12px;color:#264132;font:600 13px system-ui}.row button:hover,header button:hover{background:#e5edde}.row button:disabled{opacity:.5}details pre{overflow:auto;font-size:12px;max-height:260px;padding:12px;background:#eeeee7}.error{color:#9e2d21}summary{cursor:pointer}#stamp{display:block;margin:8px 0 0}.controls{display:flex;flex-direction:column;align-items:flex-end}#feedback{font-size:14px}.current small{color:#dae7da}@media(max-width:680px){h1{font-size:35px}.row{grid-template-columns:1fr auto}.row span{grid-column:1/-1;grid-row:auto}.current strong{font-size:19px}}
</style><main><header><div><h1>Studio research queue</h1><small id="stamp">Connecting to the Mac Studio…</small></div><div class="controls"><button id="hold">Hold after current run</button><output id="feedback" aria-live="polite"></output></div></header>
<section class="current"><h2>Running on the Studio</h2><strong id="active">Connecting…</strong><progress id="bar" max="100" value="0"></progress><small id="progress"></small></section>
<section class="section"><h2>Up next</h2><div id="next"></div></section><section class="section"><h2>Completed and closed</h2><div id="done"></div></section></main>
<script>
const el=id=>document.getElementById(id);
const labels={'door-memory-pilot':'Doorway expert → protected memory','door-memory-replication':'Independent doorway replication','reference-transformer-pilot':'14M transformer · register learning screen','reference-transformer-main':'14M transformer · matched training','reference-transformer-replication':'14M transformer · independent training order','register-addressing':'Register lookup · matched versus shifted attention','register-addressing-replication':'Register lookup · independent replication','third-camera-occlusion':'Third camera · newly visible surfaces','third-camera-confirmation':'Third camera · independent confirmation','third-camera-visibility-route':'Third camera · selective round-trip check','cpython-reference-screen':'32M Python model · learning screen','cpython-reference-mid':'32M Python model · 4,096-update comparison','cpython-reference-main':'32M Python model · 16,384-update comparison','cpython-reference-replication':'32M Python model · independent training order'};
Object.assign(labels,{'nested-donor-qualification':'Nested Python repairs · donor qualification','nested-donor-graft':'Nested Python repairs · block 27 transplant','nested-donor-replication':'Nested repairs · independent training draw'});
const name=id=>labels[id]||id;let state,loading=false;
function node(tag,txt){const n=document.createElement(tag);n.textContent=txt;return n}
function add(j,place){const row=node('div','');row.className='row';const left=node('div','');left.append(node('strong',name(j.id)));
if(j.result){const d=node('details','');d.append(node('summary','View result'),node('pre',JSON.stringify(j.result,null,2)));left.append(d)}
const status={ready:'Ready',waiting:'Conditional',done:'Finished',failed:'Failed',skipped:'Gate closed',blocked:'Blocked'}[j.status]||j.status;
let note=status;if(j.status==='waiting'||j.status==='skipped')note+=' · '+Object.entries(j.after).map(([k,v])=>name(k)+(v==='any'?' finishes':' → '+v)).join(', ');
row.append(left,node('span',note));if(['ready','waiting'].includes(j.status)){const b=node('button','Move up next');b.onclick=()=>change('next',j.id);row.append(b)}place.append(row)}
async function refresh(){if(loading)return;loading=true;try{const r=await fetch('/status');if(!r.ok)throw Error();state=await r.json();el('next').replaceChildren();el('done').replaceChildren();let j=state.jobs.find(x=>x.status==='running');
el('active').textContent=j?name(j.id):state.held?'Dispatch held':'Waiting for eligible work';const p=j&&j.progress;
el('bar').hidden=!p;if(p){el('bar').max=p.target;el('bar').value=p.step}el('progress').textContent=p?p.arm+' · '+p.step.toLocaleString()+' / '+p.target.toLocaleString()+' updates · '+Math.round(p.tokens_per_second).toLocaleString()+' tokens/s':j?'Run in progress':'';
el('hold').textContent=state.held?'Resume dispatch':'Hold after current run';for(const item of state.jobs){if(item.status==='running')continue;add(item,['ready','waiting'].includes(item.status)?el('next'):el('done'))}
el('stamp').textContent='Updated '+new Date().toLocaleTimeString()+(state.held?' · dispatch held':'');el('stamp').className='';}catch{el('stamp').textContent='Cannot reach Studio · showing last received state';el('stamp').className='error'}finally{loading=false}}
async function change(action,id){try{const r=await fetch('/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id})});if(!r.ok)throw Error();el('feedback').textContent=action==='next'?'Priority updated':action==='hold'?'Hold recorded':'Dispatch resumed';await refresh()}catch{el('feedback').textContent='Change failed; refresh and try again'}}
el('hold').onclick=()=>{if(state)change(state.held?'resume':'hold')};refresh();setInterval(refresh,10000)
</script></html>
